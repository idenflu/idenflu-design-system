name: Check generated React icons

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run test:icons -w @idenflu/ui-react
