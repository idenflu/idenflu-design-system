name: Publish GitHub Packages

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  icons-react:
    name: Publish icons and ui-react
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://npm.pkg.github.com
          scope: "@idenflu"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify docs and packages
        run: npm run check

      - name: Preview package contents
        run: |
          npm --cache ./.npm-cache pack --workspace @idenflu/ui-icons --dry-run
          npm --cache ./.npm-cache pack --workspace @idenflu/ui-react --dry-run

      - name: Publish icons
        run: |
          VERSION=$(node -p "require('./packages/icons/package.json').version")
          if npm view @idenflu/ui-icons@$VERSION version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@idenflu/ui-icons@$VERSION already exists. Skipping."
          else
            npm publish --workspace @idenflu/ui-icons
          fi

      - name: Pin @idenflu workspace deps for publish
        run: |
          node <<'EOF'
          const fs = require("fs");
          const reactPath = "packages/ui-react/package.json";
          const pkg = JSON.parse(fs.readFileSync(reactPath, "utf8"));
          const icons = JSON.parse(fs.readFileSync("packages/icons/package.json", "utf8"));
          pkg.dependencies["@idenflu/ui-icons"] = icons.version;
          fs.writeFileSync(reactPath, JSON.stringify(pkg, null, 2) + "\n");
          console.log(`pinned ui-react dep: icons@${icons.version}`);
          EOF

      - name: Publish React components
        run: |
          VERSION=$(node -p "require('./packages/ui-react/package.json').version")
          if npm view @idenflu/ui-react@$VERSION version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@idenflu/ui-react@$VERSION already exists. Skipping."
          else
            npm publish --workspace @idenflu/ui-react
          fi
